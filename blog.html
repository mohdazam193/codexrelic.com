      border: 1px solid var(--c-border);

    .blog-summary {

<!-- Dynamic Blog Loader Script -->
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const container = document.getElementById('blogs-container');

    async function loadBlogs() {
      try {
        const res = await fetch('/api/blogs');
        const blogs = await res.json();
        
        container.innerHTML = '';
        
        if (blogs.length === 0) {
          container.innerHTML = '<p style="font-family:var(--font-mono);font-size:0.8rem;color:var(--c-text-muted)">No blog posts found in database.</p>';
          return;
        }

        blogs.forEach(post => {
          const item = document.createElement('a');
          item.href = `blog/${post.slug}.html`;
          item.className = 'blog-item';

          const tagsHTML = post.tags.map(tag => `<span class="blog-tag">${tag}</span>`).join('');
          
          item.innerHTML = `
            <div class="blog-header">
              <div>
                <h2 class="blog-title">${post.title}</h2>
                <div class="blog-meta">Posted: ${post.created_at} · Category: ${post.category}</div>
              </div>
              <span class="read-time-badge">${post.read_time} min read</span>
            </div>
            <div class="blog-tag-row">
              ${tagsHTML}
            </div>
            <p class="blog-summary">
              ${post.summary}
            </p>
          `;
          container.appendChild(item);
        });

      } catch (err) {
        container.innerHTML = `<p style="font-family:var(--font-mono);font-size:0.8rem;color:var(--c-red)">Failed to load data from server: ${err.message}</p>`;
      }
    }

    loadBlogs();
  });
</script>
