apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: uat

patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: uat.codexrelic.com
    - op: replace
      path: /spec/tls/0/hosts/0
      value: uat.codexrelic.com
  target:
    kind: Ingress
    name: codexrelic-api-ingress
- patch: |-
    - op: replace
      path: /spec/maxReplicas
      value: 2
  target:
    kind: HorizontalPodAutoscaler
    name: codexrelic-api-hpa

images:
- name: DOCKER_IMAGE_PLACEHOLDER
  newName: aazammohammad193/codexrelic-api
  newTag: "185"
