apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codexrelic-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codexrelic-api
  minReplicas: 2
  maxReplicas: MAX_REPLICAS_PLACEHOLDER
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
