apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: If you modify this file or any core Argo CD configurations, 
# you MUST re-run the `azure-pipelines-argocd-setup.yml` pipeline in Azure DevOps 
# to apply the changes to the cluster. The standard application release pipeline will not apply this.

namespace: argocd

# Pull the official Argo CD manifests from the upstream repository
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  - argocd-ingress.yaml

# Patch the argocd-server service to make it suitable for Ingress
patches:
  - target:
      kind: Service
      name: argocd-server
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP

# Configure Argo CD to run without internal TLS since Traefik handles TLS termination
configMapGenerator:
  - name: argocd-cmd-params-cm
    behavior: merge
    literals:
      - server.insecure="true"
