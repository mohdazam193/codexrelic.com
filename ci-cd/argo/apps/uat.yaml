apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: codexrelic-api-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/mohdazam193/codexrelic.com.git'
    targetRevision: HEAD
    path: kubernetes
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
