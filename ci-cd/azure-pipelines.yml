trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - 'iac/**'

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'yourusername/codexrelic-api'
  dockerRegistryServiceConnection: 'dockerhub-connection' # Replace with actual connection name
  snykServiceConnection: 'snyk-connection' # Replace with actual connection name

stages:
- stage: BuildAndScan
  displayName: Build and DevSecOps Scan
  jobs:
  - job: BuildScanPush
    displayName: Build, Scan with Snyk, and Push
    steps:
    - task: Docker@2
      displayName: Build Docker Image
      inputs:
        command: build
        repository: $(imageName)
        dockerfile: 'docker/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(Build.BuildId)
          latest

    - task: SnykSecurityScan@1
      displayName: Run Snyk Container Vulnerability Scan
      inputs:
        serviceConnectionEndpoint: $(snykServiceConnection)
        testType: 'container'
        dockerImageName: '$(imageName):$(Build.BuildId)'
        dockerfilePath: 'docker/Dockerfile'
        monitorWhen: 'always'
        failOnIssues: true # Strict mode (change to false for audit mode)
        severityThreshold: 'high'

    - task: Docker@2
      displayName: Push Docker Image to DockerHub
      condition: succeeded()
      inputs:
        command: push
        repository: $(imageName)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(Build.BuildId)
          latest

- stage: ScanIaC
  displayName: Infrastructure Security Scan
  dependsOn: BuildAndScan
  jobs:
  - job: SnykIaCScan
    displayName: Snyk IaC Scan
    steps:
    - task: SnykSecurityScan@1
      displayName: Run Snyk IaC Vulnerability Scan
      inputs:
        serviceConnectionEndpoint: $(snykServiceConnection)
        testType: 'iac'
        targetFile: 'iac/'
        monitorWhen: 'always'
        failOnIssues: true # Strict mode
        severityThreshold: 'high'

- stage: TerraformPlan
  displayName: Terraform Plan
  dependsOn: ScanIaC
  jobs:
  - job: Plan
    displayName: Terraform Plan
    steps:
    - checkout: self
    - script: |
        terraform init
        terraform plan -out=tfplan
      workingDirectory: 'iac/terraform'
      displayName: 'Run Terraform Plan'
      env:
        TF_VAR_tenancy_ocid: $(TF_VAR_tenancy_ocid)
        TF_VAR_user_ocid: $(TF_VAR_user_ocid)
        TF_VAR_fingerprint: $(TF_VAR_fingerprint)
        TF_VAR_private_key: $(TF_VAR_private_key)
        TF_VAR_region: $(TF_VAR_region)
        TF_VAR_compartment_id: $(TF_VAR_compartment_id)
        TF_VAR_availability_domain: $(TF_VAR_availability_domain)
    - publish: 'iac/terraform/tfplan'
      artifact: tfplan

- stage: TerraformApply
  displayName: Terraform Apply
  dependsOn: TerraformPlan
  # Requires setting up an "Environment" named 'production' in Azure DevOps to enforce manual approval
  jobs:
  - deployment: Apply
    displayName: Terraform Apply
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - download: current
            artifact: tfplan
          - script: |
              cp $(Pipeline.Workspace)/tfplan/tfplan ./
              terraform init
              terraform apply -auto-approve tfplan
            workingDirectory: 'iac/terraform'
            displayName: 'Run Terraform Apply'
            env:
              TF_VAR_tenancy_ocid: $(TF_VAR_tenancy_ocid)
              TF_VAR_user_ocid: $(TF_VAR_user_ocid)
              TF_VAR_fingerprint: $(TF_VAR_fingerprint)
              TF_VAR_private_key: $(TF_VAR_private_key)
              TF_VAR_region: $(TF_VAR_region)
              TF_VAR_compartment_id: $(TF_VAR_compartment_id)
              TF_VAR_availability_domain: $(TF_VAR_availability_domain)
