trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/**
      - docker/**
      - ci-cd/docker/**
    exclude:
      - iac/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'yourusername/codexrelic-api'
  dockerRegistryServiceConnection: 'dockerhub-connection' # Replace with actual connection name
  snykServiceConnection: 'Synk' # Replace with actual connection name

stages:
- stage: BuildAndScan
  displayName: Build and DevSecOps Scan
  jobs:
  - job: BuildScanPush
    displayName: Build, Scan with Snyk, and Push
    steps:
    - task: Docker@2
      displayName: Build Docker Image
      inputs:
        command: build
        repository: $(imageName)
        dockerfile: 'docker/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(Build.BuildId)
          latest

    - task: SnykSecurityScan@1
      displayName: Run Snyk Container Vulnerability Scan
      inputs:
        serviceConnectionEndpoint: $(snykServiceConnection)
        testType: 'container'
        dockerImageName: '$(imageName):$(Build.BuildId)'
        dockerfilePath: 'docker/Dockerfile'
        monitorWhen: 'always'
        failOnIssues: true # Strict mode (change to false for audit mode)
        severityThreshold: 'high'

    - task: Docker@2
      displayName: Push Docker Image to DockerHub
      condition: succeeded()
      inputs:
        command: push
        repository: $(imageName)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(Build.BuildId)
          latest
