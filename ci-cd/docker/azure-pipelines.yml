        sourceFolder: '$(System.DefaultWorkingDirectory)'
        contents: |
          kubernetes/**
          .env.stage
        targetFolder: '/home/ubuntu/codexrelic-deploy/stage'
        readyTimeout: '20000'

    - task: SSH@0
      displayName: Deploy to K3s via SSH
      inputs:
        sshEndpoint: 'oci-vm-ssh'
        runOptions: 'inline'
        inline: |
          cd /home/ubuntu/codexrelic-deploy/stage
          
          # 0. Ensure namespace exists
          kubectl create namespace stage --dry-run=client -o yaml | kubectl apply -f -
          
          # 1. Create/Update Kubernetes Secret from .env file
          kubectl create secret generic codexrelic-secrets \
            --namespace=stage \
            --from-env-file=.env.stage \
            --dry-run=client -o yaml | kubectl apply -f -
            
          # 2. Update deployment image tag
          sed -i 's|DOCKER_IMAGE_PLACEHOLDER|$(imageName):$(Build.BuildId)|g' kubernetes/deployment.yaml
          
          # 3. Apply manifests
          kubectl apply -n stage -f kubernetes/deployment.yaml
          kubectl apply -n stage -f kubernetes/service.yaml
          
          # 4. Wait for rollout
          kubectl rollout status deployment/codexrelic-api -n stage

- stage: DeployToProd
  displayName: Deploy to Production
  dependsOn: DeployToStage
  condition: succeeded()
  jobs:
  - deployment: Deploy
    environment: 'Prod'
    strategy:
      runOnce:
        deploy:
          steps:
    - task: AzureKeyVault@2
      displayName: Load Prod secrets from Key Vault
      inputs:
        azureSubscription: 'keyvalute-codex'
        KeyVaultName: 'kv-prod-codexrelic'
        SecretsFilter: 'MONGO-URI,ADMIN-USER,ADMIN-PASS,JWT-SECRET,ADMIN-ED25519-PUBLIC-KEY'
        RunAsPreJob: true

    - script: |
        cat > .env.prod <<EOF
        MONGO_URI=$(MONGO-URI)
        ADMIN_USER=$(ADMIN-USER)
