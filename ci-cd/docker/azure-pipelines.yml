trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/**
      - docker/**
      - ci-cd/docker/**
    exclude:
      - iac/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'yourusername/codexrelic-api'
  dockerRegistryServiceConnection: 'dockerhub-connection' # Replace with actual connection name
  snykServiceConnection: 'Synk' # Replace with actual connection name

stages:
- stage: BuildAndScan
  displayName: Build and DevSecOps Scan
  jobs:
  - job: BuildScanPush
    displayName: Build, Scan with Snyk, and Push
    steps:
    - task: Docker@2
      displayName: Build Docker Image
      inputs:
        command: build
        repository: $(imageName)
        dockerfile: 'docker/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(Build.BuildId)
          latest

    - task: SnykSecurityScan@1
      displayName: Run Snyk Container Vulnerability Scan
      inputs:
        serviceConnectionEndpoint: $(snykServiceConnection)
        testType: 'container'
        dockerImageName: '$(imageName):$(Build.BuildId)'
        dockerfilePath: 'docker/Dockerfile'
        monitorWhen: 'always'
        failOnIssues: true # Strict mode (change to false for audit mode)
        severityThreshold: 'high'

    - task: Docker@2
      displayName: Push Docker Image to DockerHub
      condition: succeeded()
      inputs:
        command: push
        repository: $(imageName)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(Build.BuildId)
          latest

- stage: DeployToUAT
  displayName: Deploy to UAT
  dependsOn: BuildAndScan
  condition: succeeded()
  jobs:
  - deployment: Deploy
    environment: 'UAT'
    strategy:
      runOnce:
        deploy:
          steps:
    - task: AzureKeyVault@2
      displayName: Load UAT secrets from Key Vault
      inputs:
        azureSubscription: 'keyvalute-codex'
        KeyVaultName: 'kv-uat-codexrelic'
        SecretsFilter: 'MONGO-URI,ADMIN-USER,ADMIN-PASS,JWT-SECRET,ADMIN-ED25519-PUBLIC-KEY'
        RunAsPreJob: true

    - script: |
        cat > .env.uat <<EOF
        MONGO_URI=$(MONGO-URI)
        ADMIN_USER=$(ADMIN-USER)
        ADMIN_PASS=$(ADMIN-PASS)
        JWT_SECRET=$(JWT-SECRET)
        ADMIN_ED25519_PUBLIC_KEY=$(ADMIN-ED25519-PUBLIC-KEY)
        EOF
      displayName: Render .env.uat from Key Vault secrets

    - task: CopyFilesOverSSH@0
      displayName: Copy K8s manifests and .env to VM
      inputs:
        sshEndpoint: 'oci-vm-ssh' # You must create this SSH Service Connection in Azure DevOps
        sourceFolder: '$(System.DefaultWorkingDirectory)'
        contents: |
          kubernetes/**
          .env.uat
        targetFolder: '/home/ubuntu/codexrelic-deploy/uat'
        readyTimeout: '20000'

    - task: SSH@0
      displayName: Deploy to K3s via SSH
      inputs:
        sshEndpoint: 'oci-vm-ssh'
        runOptions: 'inline'
        inline: |
          cd /home/ubuntu/codexrelic-deploy/uat
          
          # 0. Ensure namespace exists
          kubectl create namespace uat --dry-run=client -o yaml | kubectl apply -f -
          
          # 1. Create/Update Kubernetes Secret from .env file
          kubectl create secret generic codexrelic-secrets \
            --namespace=uat \
            --from-env-file=.env.uat \
            --dry-run=client -o yaml | kubectl apply -f -
            
          # 2. Update deployment image tag
          sed -i 's|DOCKER_IMAGE_PLACEHOLDER|$(imageName):$(Build.BuildId)|g' kubernetes/deployment.yaml
          
          # 3. Apply manifests
          kubectl apply -n uat -f kubernetes/deployment.yaml
          kubectl apply -n uat -f kubernetes/service.yaml
          
          # 4. Wait for rollout
          kubectl rollout status deployment/codexrelic-api -n uat


- stage: DeployToStage
  displayName: Deploy to Stage
  dependsOn: DeployToUAT
  condition: succeeded()
  jobs:
  - deployment: Deploy
    environment: 'Stage'
    strategy:
      runOnce:
        deploy:
          steps:
    - task: AzureKeyVault@2
      displayName: Load Stage secrets from Key Vault
      inputs:
        azureSubscription: 'keyvalute-codex'
        KeyVaultName: 'kv-stage-codexrelic'
        SecretsFilter: 'MONGO-URI,ADMIN-USER,ADMIN-PASS,JWT-SECRET,ADMIN-ED25519-PUBLIC-KEY'
        RunAsPreJob: true

    - script: |
        cat > .env.stage <<EOF
        MONGO_URI=$(MONGO-URI)
