          # 3. Apply manifests
          kubectl apply -n prod -f kubernetes/deployment.yaml
          kubectl apply -n prod -f kubernetes/service.yaml
          
          # 4. Wait for rollout
          kubectl rollout status deployment/codexrelic-api -n prod
