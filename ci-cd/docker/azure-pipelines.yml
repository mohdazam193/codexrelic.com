        targetFolder: '/home/ubuntu/codexrelic-deploy/prod'
        readyTimeout: '20000'

    - task: SSH@0
      displayName: Deploy to K3s via SSH
      inputs:
        sshEndpoint: 'oci-vm-ssh'
        runOptions: 'inline'
        inline: |
          cd /home/ubuntu/codexrelic-deploy/prod
          
          # 0. Ensure namespace exists
          kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -
          
          # 1. Create/Update Kubernetes Secret from .env file
          kubectl create secret generic codexrelic-secrets \
            --namespace=prod \
