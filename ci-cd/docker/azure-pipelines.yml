trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/**
      - docker/**
      - ci-cd/docker/**
    exclude:
      - iac/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'yourusername/codexrelic-api'
  dockerRegistryServiceConnection: 'dockerhub-connection' # Replace with actual connection name
  snykServiceConnection: 'Synk' # Replace with actual connection name

stages:
- stage: BuildAndScan
  displayName: Build and DevSecOps Scan
  jobs:
  - job: BuildScanPush
    displayName: Build, Scan with Snyk, and Push
    steps:
    - task: Docker@2
      displayName: Build Docker Image
      inputs:
        command: build
        repository: $(imageName)
        dockerfile: 'docker/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(Build.BuildId)
          latest

    - task: SnykSecurityScan@1
      displayName: Run Snyk Container Vulnerability Scan
      inputs:
        serviceConnectionEndpoint: $(snykServiceConnection)
        testType: 'container'
        dockerImageName: '$(imageName):$(Build.BuildId)'
        dockerfilePath: 'docker/Dockerfile'
        monitorWhen: 'always'
        failOnIssues: true # Strict mode (change to false for audit mode)
        severityThreshold: 'high'

    - task: Docker@2
      displayName: Push Docker Image to DockerHub
      condition: succeeded()
      inputs:
        command: push
        repository: $(imageName)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(Build.BuildId)
          latest

- stage: DeployToUAT
  displayName: Deploy to UAT
  dependsOn: BuildAndScan
  condition: succeeded()
  jobs:
  - job: Deploy
    steps:
    - task: AzureKeyVault@2
      displayName: Load UAT secrets from Key Vault
      inputs:
        azureSubscription: 'keyvalute-codex'
        KeyVaultName: 'kv-uat-codexrelic'
        SecretsFilter: 'MONGO-URI,ADMIN-USER,ADMIN-PASS,JWT-SECRET,ADMIN-ED25519-PUBLIC-KEY'
        RunAsPreJob: true

    - script: |
        cat > .env.uat <<EOF
        MONGO_URI=$(MONGO-URI)
        ADMIN_USER=$(ADMIN-USER)
        ADMIN_PASS=$(ADMIN-PASS)
        JWT_SECRET=$(JWT-SECRET)
        ADMIN_ED25519_PUBLIC_KEY=$(ADMIN-ED25519-PUBLIC-KEY)
        EOF
      displayName: Render .env.uat from Key Vault secrets

    # TODO: Add SSH deployment to OCI VM once provisioned

- stage: DeployToStage
  displayName: Deploy to Stage
  dependsOn: DeployToUAT
  condition: succeeded()
  jobs:
  - job: Deploy
    steps:
    - task: AzureKeyVault@2
      displayName: Load Stage secrets from Key Vault
      inputs:
        azureSubscription: 'keyvalute-codex'
        KeyVaultName: 'kv-stage-codexrelic'
        SecretsFilter: 'MONGO-URI,ADMIN-USER,ADMIN-PASS,JWT-SECRET,ADMIN-ED25519-PUBLIC-KEY'
        RunAsPreJob: true

    - script: |
        cat > .env.stage <<EOF
        MONGO_URI=$(MONGO-URI)
        ADMIN_USER=$(ADMIN-USER)
        ADMIN_PASS=$(ADMIN-PASS)
        JWT_SECRET=$(JWT-SECRET)
        ADMIN_ED25519_PUBLIC_KEY=$(ADMIN-ED25519-PUBLIC-KEY)
        EOF
      displayName: Render .env.stage from Key Vault secrets

    # TODO: Add SSH deployment to OCI VM once provisioned

- stage: DeployToProd
  displayName: Deploy to Production
  dependsOn: DeployToStage
  condition: succeeded()
  jobs:
  - job: Deploy
    steps:
    - task: AzureKeyVault@2
      displayName: Load Prod secrets from Key Vault
      inputs:
        azureSubscription: 'keyvalute-codex'
        KeyVaultName: 'kv-prod-codexrelic'
        SecretsFilter: 'MONGO-URI,ADMIN-USER,ADMIN-PASS,JWT-SECRET,ADMIN-ED25519-PUBLIC-KEY'
        RunAsPreJob: true

    - script: |
        cat > .env.prod <<EOF
        MONGO_URI=$(MONGO-URI)
        ADMIN_USER=$(ADMIN-USER)
        ADMIN_PASS=$(ADMIN-PASS)
        JWT_SECRET=$(JWT-SECRET)
        ADMIN_ED25519_PUBLIC_KEY=$(ADMIN-ED25519-PUBLIC-KEY)
        EOF
      displayName: Render .env.prod from Key Vault secrets

    # TODO: Add SSH deployment to OCI VM once provisioned
