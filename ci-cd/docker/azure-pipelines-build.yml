trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/**
      - docker/**
      - kubernetes/**
      - ci-cd/docker/**
    exclude:
      - iac/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'aazammohammad193/codexrelic-api'
  dockerRegistryServiceConnection: 'dockerhub-connection' # Replace with actual connection name
  snykServiceConnection: 'Synk' # Matching the user's existing Service Connection name

stages:
- stage: BuildAndScan
  displayName: Build and DevSecOps Scan
  jobs:
  - job: BuildScanPush
    displayName: Build, Scan with Snyk, and Push
    steps:
    - script: |
        echo "Installing TruffleHog..."
        curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
        echo "Running TruffleHog Secret Scan (Audit Mode)..."
        trufflehog filesystem . || echo "TruffleHog found secrets, but we are running in Audit Mode so the build will not fail."
      displayName: 'Run TruffleHog Secret Scan'

    - script: |
        echo "Installing Python dependencies so Snyk can build the dependency tree..."
        python3 -m pip install -r src/requirements.txt
      displayName: 'Install Dependencies for Snyk SCA'

    - task: SnykSecurityScan@1
      displayName: Run Snyk Vulnerability Scan (SAST/SCA)
      inputs:
        serviceConnectionEndpoint: $(snykServiceConnection)
        testType: 'app'
        targetFile: 'src/requirements.txt' # Tell Snyk where the manifest is
        monitorWhen: 'always'
        failOnIssues: true # Fail the build if code vulnerabilities are found
        severityThreshold: 'high'
    - script: |
        echo "Setting up QEMU for ARM64 cross-compilation..."
        docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      displayName: 'Setup QEMU for ARM64 builds'

    - script: |
        echo "Injecting dynamic build version into HTML files..."
        find src/public -type f -name "*.html" -exec sed -i "s/codexrelic.com v1.0.0/codexrelic.com v1.0.$(Build.BuildId)/g" {} +
      displayName: 'Inject Build Version'

    - task: Docker@2
      displayName: Login to DockerHub for Buildx Caching
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)

    - script: |
        echo "Creating Buildx builder..."
        docker buildx create --use
        echo "Building image with Buildx caching..."
        docker buildx build \
          --platform linux/arm64 \
          --cache-from type=registry,ref=$(imageName):buildcache \
          --cache-to type=registry,ref=$(imageName):buildcache,mode=max \
          --load \
          -t $(imageName):$(Build.BuildId) \
          -t $(imageName):latest \
          -f docker/Dockerfile .
      displayName: 'Build Docker Image with Buildx Caching'

    - task: SnykSecurityScan@1
      displayName: Run Snyk Container Vulnerability Scan
      inputs:
        serviceConnectionEndpoint: $(snykServiceConnection)
        testType: 'container'
        dockerImageName: '$(imageName):$(Build.BuildId)'
        dockerfilePath: 'docker/Dockerfile'
        monitorWhen: 'always'
        failOnIssues: true # Strict mode (change to false for audit mode)
        severityThreshold: 'high'

    - task: Docker@2
      displayName: Push Docker Image to DockerHub
      condition: succeeded()
      inputs:
        command: push
        repository: $(imageName)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(Build.BuildId)
          latest

    - task: PublishPipelineArtifact@1
      displayName: Publish Kubernetes Manifests as Artifact
      condition: succeeded()
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/kubernetes'
        artifact: 'k8s-manifests'
        publishLocation: 'pipeline'
