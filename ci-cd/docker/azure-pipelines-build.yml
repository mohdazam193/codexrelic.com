trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/**
      - docker/**
      - kubernetes/**
      - ci-cd/docker/**
    exclude:
      - iac/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'yourusername/codexrelic-api'
  dockerRegistryServiceConnection: 'dockerhub-connection' # Replace with actual connection name
  snykServiceConnection: 'Synk' # Replace with actual connection name

stages:
- stage: BuildAndScan
  displayName: Build and DevSecOps Scan
  jobs:
  - job: BuildScanPush
    displayName: Build, Scan with Snyk, and Push
    steps:
    - script: |
        echo "Installing TruffleHog..."
        curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
        echo "Running TruffleHog Secret Scan (Audit Mode)..."
        trufflehog filesystem . || echo "TruffleHog found secrets, but we are running in Audit Mode so the build will not fail."
      displayName: 'Run TruffleHog Secret Scan'

    - task: SnykSecurityScan@1
      displayName: Run Snyk Vulnerability Scan (SAST/SCA)
      inputs:
        serviceConnectionEndpoint: $(snykServiceConnection)
        testType: 'app'
        targetFile: 'src/requirements.txt' # Tell Snyk where the manifest is
        monitorWhen: 'always'
        failOnIssues: true # Fail the build if code vulnerabilities are found
        severityThreshold: 'high'
    - task: Docker@2
      displayName: Build Docker Image
      inputs:
        command: build
        repository: $(imageName)
        dockerfile: 'docker/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(Build.BuildId)
          latest

    - task: SnykSecurityScan@1
      displayName: Run Snyk Container Vulnerability Scan
      inputs:
        serviceConnectionEndpoint: $(snykServiceConnection)
        testType: 'container'
        dockerImageName: '$(imageName):$(Build.BuildId)'
        dockerfilePath: 'docker/Dockerfile'
        monitorWhen: 'always'
        failOnIssues: true # Strict mode (change to false for audit mode)
        severityThreshold: 'high'

    - task: Docker@2
      displayName: Push Docker Image to DockerHub
      condition: succeeded()
      inputs:
        command: push
        repository: $(imageName)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(Build.BuildId)
          latest

    - task: PublishPipelineArtifact@1
      displayName: Publish Kubernetes Manifests as Artifact
      condition: succeeded()
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/kubernetes'
        artifact: 'k8s-manifests'
        publishLocation: 'pipeline'
