trigger: none

schedules:
- cron: "0 0 * * *" # Every day at midnight
  displayName: "Daily SSL Certificate Check"
  branches:
    include:
    - main
  always: true

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: SSH@0
  displayName: Check SSL Certificates in Kubernetes
  inputs:
    sshEndpoint: 'oci-vm-ssh'
    runOptions: 'inline'
    inline: |
      echo "Checking status of all certificates in the cluster..."
      sudo kubectl get certificates -A
      
      echo "Checking for expired or not ready certificates..."
      FAILS=$(sudo kubectl get certificates -A --no-headers | awk '$3 != "True" {print $1 "/" $2 " (Ready: " $3 ")"}')
      
      if [ -n "$FAILS" ]; then
        echo "##[error] The following certificates are not ready or failing:"
        echo "$FAILS"
        exit 1
      else
        echo "All certificates are healthy and ready!"
      fi
