trigger: none # Do not trigger on code push, only trigger via the Pipeline resource below

resources:
  pipelines:
  - pipeline: BuildPipeline
    source: '\Build\Code Build Pipelines' # Matching the exact folder and name from Azure DevOps
    trigger: true

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'aazammohammad193/codexrelic-api'
  # The Build Pipeline tags the image with its Run ID. We capture that here to deploy the exact same image.
  imageTag: '$(resources.pipeline.BuildPipeline.runID)'

stages:
- stage: DeployToUAT
  displayName: Deploy to UAT
  jobs:
  - deployment: Deploy
    environment: 'UAT'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            displayName: Download Kubernetes Manifests
            inputs:
              buildType: 'specific'
              project: '$(System.TeamProject)'
              definition: '$(resources.pipeline.BuildPipeline.pipelineID)'
              buildVersionToDownload: 'specific'
              pipelineId: '$(resources.pipeline.BuildPipeline.runID)'
              artifactName: 'k8s-manifests'
              targetPath: '$(Pipeline.Workspace)/k8s-manifests'

          - task: AzureKeyVault@2
            displayName: Load UAT secrets from Key Vault
            inputs:
              azureSubscription: 'keyvalute-codex'
              KeyVaultName: 'kv-uat-codexrelic'
              SecretsFilter: 'MONGO-URI,ADMIN-USER,ADMIN-PASS,JWT-SECRET,ADMIN-ED25519-PUBLIC-KEY'
              RunAsPreJob: true

          - script: |
              cat > $(Pipeline.Workspace)/.env.uat <<EOF
              MONGO_URI=$(MONGO-URI)
              ADMIN_USER=$(ADMIN-USER)
              ADMIN_PASS=$(ADMIN-PASS)
              JWT_SECRET=$(JWT-SECRET)
              ADMIN_ED25519_PUBLIC_KEY=$(ADMIN-ED25519-PUBLIC-KEY)
              EOF
            displayName: Render .env.uat from Key Vault secrets

          - task: CopyFilesOverSSH@0
            displayName: Copy K8s manifests and .env to VM
            inputs:
              sshEndpoint: 'oci-vm-ssh'
              sourceFolder: '$(Pipeline.Workspace)'
              contents: |
                k8s-manifests/**
                .env.uat
              targetFolder: '/home/ubuntu/codexrelic-deploy/uat'
              readyTimeout: '20000'

          - task: SSH@0
            displayName: Deploy to K3s via SSH
            inputs:
              sshEndpoint: 'oci-vm-ssh'
              runOptions: 'inline'
              inline: |
                cd /home/ubuntu/codexrelic-deploy/uat
                
                # 0. Ensure namespace exists
                sudo kubectl create namespace uat --dry-run=client -o yaml | sudo kubectl apply -f -
                
                # 1. Create/Update Kubernetes Secret from .env file
                sudo kubectl create secret generic codexrelic-secrets \
                  --namespace=uat \
                  --from-env-file=.env.uat \
                  --dry-run=client -o yaml | sudo kubectl apply -f -
                  
                # 2. Update deployment image tag
                sed -i 's|DOCKER_IMAGE_PLACEHOLDER|$(imageName):$(imageTag)|g' k8s-manifests/deployment.yaml
                
                # 3. Apply manifests
                sudo kubectl apply -n uat -f k8s-manifests/deployment.yaml
                sudo kubectl apply -n uat -f k8s-manifests/service.yaml
                
                # 4. Wait for rollout
                sudo kubectl rollout status deployment/codexrelic-api -n uat


