parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: environmentName
    type: string
  - name: dependsOn
    type: string
    default: ''
  - name: keyVaultName
    type: string
  - name: namespace
    type: string
  - name: ingressDomain
    type: string
  - name: observDomain
    type: string
  - name: deployFolder
    type: string
  - name: maxReplicas
    type: string

stages:
- stage: ${{ parameters.stageName }}
  displayName: ${{ parameters.displayName }}
  ${{ if ne(parameters.dependsOn, '') }}:
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
  jobs:
  - deployment: Deploy
    environment: ${{ parameters.environmentName }}
    strategy:
      runOnce:
        deploy:
          steps:
          # 1. Download the Kubernetes manifests created in the Build Pipeline
          - task: DownloadPipelineArtifact@2
            displayName: Download Kubernetes Manifests
            inputs:
              buildType: 'specific'
              project: '$(System.TeamProject)'
              definition: '$(resources.pipeline.BuildPipeline.pipelineID)'
              buildVersionToDownload: 'specific'
              pipelineId: '$(resources.pipeline.BuildPipeline.runID)'
              artifactName: 'k8s-manifests'
              targetPath: '$(Pipeline.Workspace)/k8s-manifests'

          # 2. Fetch Environment-Specific Secrets (MongoDB, Passwords)
          - task: AzureKeyVault@2
            displayName: Load ${{ parameters.environmentName }} secrets from Key Vault
            inputs:
              azureSubscription: 'keyvalute-codex'
              KeyVaultName: ${{ parameters.keyVaultName }}
              SecretsFilter: 'MONGO-URI,JWT-SECRET,O2-ROOT-USER,O2-ROOT-PASSWORD'
              RunAsPreJob: true

          # 3. Fetch GitHub Credentials for GitOps push
          - task: AzureKeyVault@2
            displayName: Load GitHub credentials
            inputs:
              azureSubscription: 'keyvalute-codex'
              KeyVaultName: 'kv-github-codexrelic'
              SecretsFilter: 'GITHUB-PAT,GITHUB-USERNAME'
              RunAsPreJob: true

          # 4. Fetch Common Secrets (S3 Credentials)
          - task: AzureKeyVault@2
            displayName: Load common S3 secrets from Key Vault
            inputs:
              azureSubscription: 'keyvalute-codex'
              KeyVaultName: 'kv-aws-s3'
              SecretsFilter: 'AWS-ACCESS-KEY-ID,AWS-SECRET-ACCESS-KEY,AWS-ENDPOINT-URL-S3,AWS-DEFAULT-REGION,AWS-S3-BUCKET'
              RunAsPreJob: true

          # 5. Generate the .env file dynamically
          - script: |
              cat > $(Pipeline.Workspace)/.env.${{ parameters.namespace }} << 'EOF'
              MONGO_URI=$(MONGO-URI)
              JWT_SECRET=$(JWT-SECRET)
              AWS_ACCESS_KEY_ID=$(AWS-ACCESS-KEY-ID)
              AWS_SECRET_ACCESS_KEY=$(AWS-SECRET-ACCESS-KEY)
              AWS_ENDPOINT_URL_S3=$(AWS-ENDPOINT-URL-S3)
              AWS_DEFAULT_REGION=$(AWS-DEFAULT-REGION)
              AWS_S3_BUCKET=$(AWS-S3-BUCKET)
              APP_ENV=${{ parameters.namespace }}
              O2_ROOT_USER=$(O2-ROOT-USER)
              O2_ROOT_PASSWORD=$(O2-ROOT-PASSWORD)
              EOF
              
              cat > $(Pipeline.Workspace)/o2-values.yaml << 'EOF'
              auth:
                ZO_ROOT_USER_EMAIL: '$(O2-ROOT-USER)'
                ZO_ROOT_USER_PASSWORD: '$(O2-ROOT-PASSWORD)'
                ZO_S3_ACCESS_KEY: '$(AWS-ACCESS-KEY-ID)'
                ZO_S3_SECRET_KEY: '$(AWS-SECRET-ACCESS-KEY)'
              EOF
            displayName: Render .env and values from Key Vault secrets

          # 6. Update Git repository (GitOps push)
          - script: |
              # Configure git
              git config --global user.email "azure-pipelines@codexrelic.com"
              git config --global user.name "Azure Pipelines"
              
              # Clone repo using PAT from environment variables mapped below
              git clone https://${GITHUB_USERNAME}:${GITHUB_PAT}@github.com/mohdazam193/codexrelic.com.git repo
              cd repo/kubernetes/overlays/${{ parameters.namespace }}
              
              # Install kustomize if not present on agent
              if ! command -v kustomize &> /dev/null; then
                  curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
                  sudo mv kustomize /usr/local/bin/
              fi
              
              # Update image tag via kustomize
              kustomize edit set image DOCKER_IMAGE_PLACEHOLDER=$(imageName):$(imageTag)
              
              # Commit and push
              git add kustomization.yaml
              git commit -m "chore(${{ parameters.namespace }}): update image to $(imageTag) [skip ci]" || echo "No changes to commit"
              git push origin main
            displayName: Update Git repository (GitOps push)
            env:
              GITHUB_USERNAME: $(GITHUB-USERNAME)
              GITHUB_PAT: $(GITHUB-PAT)

          # 7. Copy Manifests and .env file to the target K3s Server via SSH
          - task: CopyFilesOverSSH@0
            displayName: Copy K8s manifests and .env to VM
            inputs:
              sshEndpoint: 'oci-vm-ssh'
              sourceFolder: '$(Pipeline.Workspace)'
              contents: |
                k8s-manifests/**
                .env.${{ parameters.namespace }}
                o2-values.yaml
              targetFolder: ${{ parameters.deployFolder }}
              readyTimeout: '20000'

          # 8. Execute Kubernetes Commands on the K3s Server
          - task: SSH@0
            displayName: Deploy to K3s via SSH
            inputs:
              sshEndpoint: 'oci-vm-ssh'
              runOptions: 'inline'
              inline: |
                cd ${{ parameters.deployFolder }}
                
                # Install cert-manager if not installed
                sudo kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.4/cert-manager.yaml
                sudo kubectl wait --for=condition=Available deployment/cert-manager-webhook -n cert-manager --timeout=120s || true
                
                # Apply ClusterIssuer
                sudo kubectl apply -f k8s-manifests/clusterissuer.yaml || echo "ClusterIssuer applied via ArgoCD"
                
                # Ensure namespace exists
                sudo kubectl create namespace ${{ parameters.namespace }} --dry-run=client -o yaml | sudo kubectl apply -f -
                sudo kubectl create namespace observability --dry-run=client -o yaml | sudo kubectl apply -f -
                
                # Create/Update Kubernetes Secret from .env file
                sudo kubectl create secret generic codexrelic-secrets \
                  --namespace=${{ parameters.namespace }} \
                  --from-env-file=.env.${{ parameters.namespace }} \
                  --dry-run=client -o yaml | sudo kubectl apply -f -
                  
                # Install Helm if not present
                if ! command -v helm &> /dev/null
                then
                    curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
                    chmod 700 get_helm.sh
                    sudo ./get_helm.sh
                fi
                
                if [ "${{ parameters.environmentName }}" == "Prod" ]; then
                  # Install/Update OpenObserve Backend via Helm
                  helm repo add openobserve https://charts.openobserve.ai
                  helm repo update
                  
                  for i in 1 2 3; do
                    helm upgrade --install o2 openobserve/openobserve-standalone \
                      --namespace observability \
                      --set postgres.enabled=false \
                      --set prometheus.serviceMonitor.enabled=false \
                      --set prometheus.podMonitor.enabled=false \
                      --set nats.metrics.enabled=false \
                      --set nats.promExporter.podMonitor.enabled=false \
                      --set config.ZO_LOCAL_MODE="true" \
                      --set config.ZO_COMPACT_DATA_RETENTION_DAYS="5" \
                      -f o2-values.yaml \
                      --set config.ZO_S3_SERVER_URL="$(AWS-ENDPOINT-URL-S3)" \
                      --set config.ZO_S3_REGION_NAME="$(AWS-DEFAULT-REGION)" \
                      --set config.ZO_S3_BUCKET_NAME="$(AWS-S3-BUCKET)" \
                      --set config.ZO_S3_PROVIDER="s3" \
                      --set ingress.enabled=true \
                      --set ingress.className="traefik" \
                      --set ingress.hosts[0].host=prod-observ.codexrelic.com \
                      --set ingress.hosts[0].paths[0].path="/" \
                      --set ingress.hosts[0].paths[0].pathType="ImplementationSpecific" \
                      --set ingress.tls[0].secretName="openobserve-tls" \
                      --set ingress.tls[0].hosts[0]=prod-observ.codexrelic.com \
                      --set-string ingress.annotations."cert-manager\.io/cluster-issuer"="letsencrypt-prod" \
                      --set-string ingress.annotations."traefik\.ingress\.kubernetes\.io/router\.entrypoints"="websecure" \
                      --set-string ingress.annotations."traefik\.ingress\.kubernetes\.io/router\.tls"="true" \
                      --timeout 10m && break || echo "Helm upgrade o2 failed, retrying in 15s..." && sleep 15
                  done
                    
                  # Install/Update OpenTelemetry Collector (DaemonSet)
                  # Safely read credentials from the .env file to avoid inline bash interpolation breaking on special characters
                  O2_USER=$(grep -Po '^O2_ROOT_USER=\K.*' .env.${{ parameters.namespace }})
                  O2_PASS=$(grep -Po '^O2_ROOT_PASSWORD=\K.*' .env.${{ parameters.namespace }})
                  AUTH_BASE64=$(echo -n "$O2_USER:$O2_PASS" | base64 | tr -d '\n')
                  
                  echo "mode: daemonset" > /tmp/otel-values.yaml
                  echo "presets:" >> /tmp/otel-values.yaml
                  echo "  logsCollection:" >> /tmp/otel-values.yaml
                  echo "  hostMetrics:" >> /tmp/otel-values.yaml
                  echo "    enabled: true" >> /tmp/otel-values.yaml
                  echo "  kubeletMetrics:" >> /tmp/otel-values.yaml
                  echo "    enabled: true" >> /tmp/otel-values.yaml
                  echo "  kubernetesEvents:" >> /tmp/otel-values.yaml
                  echo "    enabled: true" >> /tmp/otel-values.yaml
                  echo "  kubernetesObjects:" >> /tmp/otel-values.yaml
                  echo "    enabled: true" >> /tmp/otel-values.yaml
                  echo "  kubernetesAttributes:" >> /tmp/otel-values.yaml
                  echo "    enabled: true" >> /tmp/otel-values.yaml
                  echo "image:" >> /tmp/otel-values.yaml
                  echo "  repository: \"ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib\"" >> /tmp/otel-values.yaml
                  echo "command:" >> /tmp/otel-values.yaml
                  echo "  name: \"otelcol-contrib\"" >> /tmp/otel-values.yaml
                  echo "config:" >> /tmp/otel-values.yaml
                  echo "  exporters:" >> /tmp/otel-values.yaml
                  echo "    otlphttp:" >> /tmp/otel-values.yaml
                  echo "      endpoint: \"http://o2-openobserve-standalone.observability.svc.cluster.local:5080/api/default\"" >> /tmp/otel-values.yaml
                  echo "      headers:" >> /tmp/otel-values.yaml
                  echo "        Authorization: \"Basic ${AUTH_BASE64}\"" >> /tmp/otel-values.yaml
                  echo "        stream-name: \"default\"" >> /tmp/otel-values.yaml
                  echo "  service:" >> /tmp/otel-values.yaml
                  echo "    pipelines:" >> /tmp/otel-values.yaml
                  echo "      logs:" >> /tmp/otel-values.yaml
                  echo "        exporters: [otlphttp]" >> /tmp/otel-values.yaml
                  echo "      metrics:" >> /tmp/otel-values.yaml
                  echo "        exporters: [otlphttp]" >> /tmp/otel-values.yaml
                  
                  helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
                  helm repo update
                  
                  for i in 1 2 3 4 5; do
                    helm upgrade --install o2-collector open-telemetry/opentelemetry-collector \
                      --namespace observability \
                      -f /tmp/otel-values.yaml \
                      --timeout 10m && break || echo "Helm upgrade collector failed, retrying in 15s..." && sleep 15
                  done
                else
                  echo "Skipping observability deployment. Only deployed during Prod stage."
                fi
                
                # Force ArgoCD to sync the latest commit immediately
                sudo kubectl patch app codexrelic-api-${{ parameters.namespace }} -n argocd --type merge -p '{"operation": {"sync": {"revision": "HEAD"}}}' || echo "ArgoCD app not found, skipping sync"
                
                # Wait for Argo Rollouts
                sudo kubectl rollout status rollout/codexrelic-api -n ${{ parameters.namespace }}
