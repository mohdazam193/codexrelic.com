trigger:
  branches:
    include:
      - main
  paths:
    include:
      - iac/oci/**

variables:
- group: terraform

pool:
  vmImage: 'ubuntu-latest'

stages:
# ─────────────────────────────────────────────
# STAGE 1: Init & Plan
# ─────────────────────────────────────────────
- stage: TerraformInitAndPlan
  displayName: '1. Terraform Plan'
  jobs:
  - job: Plan
    displayName: 'Init & Plan'
    steps:
    - script: |
        set -e

        # Install Terraform
        wget -q -O terraform.zip https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
        unzip -q terraform.zip
        sudo mv terraform /usr/local/bin/
        echo "Terraform $(terraform version -json | python3 -c 'import sys,json; print(json.load(sys.stdin)["terraform_version"])')"

        # ─── KEY FIX ───────────────────────────────────────────────────────────
        # The OCI private key is a multiline PEM file. Azure DevOps corrupts
        # newlines when passing multiline values as env vars. So we store it
        # as a base64-encoded single-line string (OCI_PRIVATE_KEY_B64) in the
        # variable group, and decode it back to a file here.
        # ───────────────────────────────────────────────────────────────────────
        echo "$OCI_PRIVATE_KEY_B64" | base64 --decode > /tmp/oci_api_key.pem
        chmod 600 /tmp/oci_api_key.pem
        echo "[OK] OCI private key written to /tmp/oci_api_key.pem"

        cd iac/oci

        echo "Initializing Terraform backend (OCI Object Storage)..."
        terraform init -input=false \
          -backend-config="bucket=$TF_STATE_BUCKET" \
          -backend-config="key=prod.terraform.tfstate" \
          -backend-config="region=$TF_VAR_region" \
          -backend-config="endpoint=$TF_STATE_ENDPOINT" \
          -backend-config="access_key=$TF_STATE_ACCESS_KEY" \
          -backend-config="secret_key=$TF_STATE_SECRET_KEY"

        echo "Running Terraform Plan..."
        terraform plan -out=tfplan -input=false
      displayName: 'Terraform Init & Plan'
      env:
        # OCI Auth
        TF_VAR_tenancy_ocid:        $(TF_VAR_tenancy_ocid)
        TF_VAR_user_ocid:           $(TF_VAR_user_ocid)
        TF_VAR_fingerprint:         $(TF_VAR_fingerprint)
        TF_VAR_private_key_path:    /tmp/oci_api_key.pem
        TF_VAR_region:              $(TF_VAR_region)
        # OCI Resources
        TF_VAR_compartment_id:      $(TF_VAR_compartment_id)
        TF_VAR_availability_domain: $(TF_VAR_availability_domain)
        TF_VAR_ssh_public_key:      $(TF_VAR_ssh_public_key)
        # OCI key (base64 encoded) - decoded at runtime, never written to disk by AzDO
        OCI_PRIVATE_KEY_B64:        $(OCI_PRIVATE_KEY_B64)
        # Terraform state (OCI S3)
        TF_STATE_BUCKET:            $(TF_STATE_BUCKET)
        TF_STATE_ENDPOINT:          $(TF_STATE_ENDPOINT)
        TF_STATE_ACCESS_KEY:        $(TF_STATE_ACCESS_KEY)
        TF_STATE_SECRET_KEY:        $(TF_STATE_SECRET_KEY)

    - publish: $(System.DefaultWorkingDirectory)/iac/oci
      artifact: TerraformPlan
      displayName: 'Publish Plan Artifact'

# ─────────────────────────────────────────────
# STAGE 2: Manual Approval Gate
# ─────────────────────────────────────────────
- stage: Approval
  displayName: '2. Manual Approval'
  dependsOn: TerraformInitAndPlan
  jobs:
  - job: WaitForApproval
    displayName: 'Review Plan & Approve'
    pool: server
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: ''
        instructions: |
          Review the Terraform Plan output from Stage 1.
          Click RESUME to apply the infrastructure, or REJECT to cancel.

# ─────────────────────────────────────────────
# STAGE 3: Apply
# ─────────────────────────────────────────────
- stage: TerraformApply
  displayName: '3. Terraform Apply'
  dependsOn: Approval
  jobs:
  - job: Apply
    displayName: 'Apply'
    steps:
    - download: current
      artifact: TerraformPlan
      displayName: 'Download Plan Artifact'

    # Azure DevOps strips executable permissions from artifact files during
    # upload/download. Terraform provider binaries must be re-marked executable
    # or the apply stage will fail with "permission denied".
    - script: |
        find $(Pipeline.Workspace)/TerraformPlan/.terraform -type f -name "terraform-provider-*" -exec chmod +x {} \;
        echo "[OK] Provider binary permissions restored."
      displayName: 'Restore Provider Permissions'

    - script: |
        set -e

        wget -q -O terraform.zip https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
        unzip -q terraform.zip
        sudo mv terraform /usr/local/bin/

        # Decode the base64 OCI key back to a file
        echo "$OCI_PRIVATE_KEY_B64" | base64 --decode > /tmp/oci_api_key.pem
        chmod 600 /tmp/oci_api_key.pem
        echo "[OK] OCI private key restored."

        cd $(Pipeline.Workspace)/TerraformPlan

        echo "Re-initializing Terraform backend..."
        terraform init -input=false \
          -backend-config="bucket=$TF_STATE_BUCKET" \
          -backend-config="key=prod.terraform.tfstate" \
          -backend-config="region=$TF_VAR_region" \
          -backend-config="endpoint=$TF_STATE_ENDPOINT" \
          -backend-config="access_key=$TF_STATE_ACCESS_KEY" \
          -backend-config="secret_key=$TF_STATE_SECRET_KEY"

        # ──────────────────────────────────────────────────────────────
        # OCI Always Free ARM (Ampere A1) instances are extremely popular
        # and OCI frequently returns "Out of host capacity" (500 error).
        # This is not a code bug — it means no free slots exist right now.
        # We retry every 5 minutes for up to 100 minutes automatically.
        # ──────────────────────────────────────────────────────────────
        MAX_RETRIES=20
        WAIT_SECONDS=300  # 5 minutes between retries
        attempt=1

        until terraform apply -auto-approve -input=false tfplan; do
          EXIT_CODE=$?
          if [ $attempt -ge $MAX_RETRIES ]; then
            echo "##[error] Terraform apply failed after $MAX_RETRIES attempts. Giving up."
            exit $EXIT_CODE
          fi
          echo "##[warning] Apply failed (attempt $attempt/$MAX_RETRIES). OCI may be out of capacity."
          echo "Waiting ${WAIT_SECONDS}s before retrying..."
          sleep $WAIT_SECONDS
          attempt=$((attempt + 1))
          echo "Retrying now (attempt $attempt/$MAX_RETRIES)..."
        done

        echo "[OK] Terraform Apply succeeded on attempt $attempt."
      displayName: 'Terraform Apply (with OCI capacity retry)'
      env:
        TF_VAR_tenancy_ocid:        $(TF_VAR_tenancy_ocid)
        TF_VAR_user_ocid:           $(TF_VAR_user_ocid)
        TF_VAR_fingerprint:         $(TF_VAR_fingerprint)
        TF_VAR_private_key_path:    /tmp/oci_api_key.pem
        TF_VAR_region:              $(TF_VAR_region)
        TF_VAR_compartment_id:      $(TF_VAR_compartment_id)
        TF_VAR_availability_domain: $(TF_VAR_availability_domain)
        TF_VAR_ssh_public_key:      $(TF_VAR_ssh_public_key)
        OCI_PRIVATE_KEY_B64:        $(OCI_PRIVATE_KEY_B64)
        TF_STATE_BUCKET:            $(TF_STATE_BUCKET)
        TF_STATE_ENDPOINT:          $(TF_STATE_ENDPOINT)
        TF_STATE_ACCESS_KEY:        $(TF_STATE_ACCESS_KEY)
        TF_STATE_SECRET_KEY:        $(TF_STATE_SECRET_KEY)
