trigger:
  branches:
    include:
      - main
  paths:
    include:
      - iac/oci/**

variables:
- group: terraform

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: TerraformInitAndPlan
  displayName: 'Init & Plan'
  jobs:
  - job: Plan
    displayName: 'Terraform Init & Plan'
    steps:
    - script: |
        wget -O terraform.zip https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
        unzip terraform.zip
        sudo mv terraform /usr/local/bin/

        cd iac/oci

        echo "Initializing Terraform..."
        terraform init -input=false \
          -backend-config="bucket=$TF_STATE_BUCKET" \
          -backend-config="key=prod.terraform.tfstate" \
          -backend-config="region=$TF_VAR_region" \
          -backend-config="endpoint=$TF_STATE_ENDPOINT" \
          -backend-config="access_key=$TF_STATE_ACCESS_KEY" \
          -backend-config="secret_key=$TF_STATE_SECRET_KEY"

        echo "Creating Terraform Plan..."
        terraform plan -out=tfplan -input=false
      displayName: 'Run Terraform Plan'
      env:
        # All TF_VAR_ variables must be explicitly mapped into the bash environment
        # Azure DevOps does not automatically export variable group vars to the shell
        TF_VAR_tenancy_ocid:    $(TF_VAR_tenancy_ocid)
        TF_VAR_user_ocid:       $(TF_VAR_user_ocid)
        TF_VAR_fingerprint:     $(TF_VAR_fingerprint)
        TF_VAR_private_key:     $(TF_VAR_private_key)
        TF_VAR_region:          $(TF_VAR_region)
        TF_VAR_compartment_id:  $(TF_VAR_compartment_id)
        TF_VAR_ssh_public_key:  $(TF_VAR_ssh_public_key)
        TF_VAR_availability_domain: $(TF_VAR_availability_domain)
        # S3 backend secrets
        TF_STATE_BUCKET:      $(TF_STATE_BUCKET)
        TF_STATE_ENDPOINT:    $(TF_STATE_ENDPOINT)
        TF_STATE_ACCESS_KEY:  $(TF_STATE_ACCESS_KEY)
        TF_STATE_SECRET_KEY:  $(TF_STATE_SECRET_KEY)

    # Publish the plan and Terraform code for the Apply stage
    - publish: $(System.DefaultWorkingDirectory)/iac/oci
      artifact: TerraformPlan
      displayName: 'Publish Plan Artifact'

- stage: Approval
  displayName: 'Manual Approval Gate'
  dependsOn: TerraformInitAndPlan
  jobs:
  - job: WaitForValidation
    displayName: 'Wait for User Approval'
    pool: server
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: ''
        instructions: 'Please review the Terraform Plan output in the previous stage. Click "Resume" to approve and Apply, or "Reject" to cancel.'

- stage: TerraformApply
  displayName: 'Apply'
  dependsOn: Approval
  jobs:
  - job: Apply
    displayName: 'Terraform Apply'
    steps:
    - download: current
      artifact: TerraformPlan
      displayName: 'Download Plan Artifact'

    - script: |
        wget -O terraform.zip https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
        unzip terraform.zip
        sudo mv terraform /usr/local/bin/

        cd $(Pipeline.Workspace)/TerraformPlan

        echo "Re-initializing Terraform..."
        terraform init -input=false \
          -backend-config="bucket=$TF_STATE_BUCKET" \
          -backend-config="key=prod.terraform.tfstate" \
          -backend-config="region=$TF_VAR_region" \
          -backend-config="endpoint=$TF_STATE_ENDPOINT" \
          -backend-config="access_key=$TF_STATE_ACCESS_KEY" \
          -backend-config="secret_key=$TF_STATE_SECRET_KEY"

        echo "Applying Terraform Plan..."
        terraform apply -auto-approve -input=false tfplan
      displayName: 'Run Terraform Apply'
      env:
        TF_VAR_tenancy_ocid:    $(TF_VAR_tenancy_ocid)
        TF_VAR_user_ocid:       $(TF_VAR_user_ocid)
        TF_VAR_fingerprint:     $(TF_VAR_fingerprint)
        TF_VAR_private_key:     $(TF_VAR_private_key)
        TF_VAR_region:          $(TF_VAR_region)
        TF_VAR_compartment_id:  $(TF_VAR_compartment_id)
        TF_VAR_ssh_public_key:  $(TF_VAR_ssh_public_key)
        TF_VAR_availability_domain: $(TF_VAR_availability_domain)
        TF_STATE_BUCKET:      $(TF_STATE_BUCKET)
        TF_STATE_ENDPOINT:    $(TF_STATE_ENDPOINT)
        TF_STATE_ACCESS_KEY:  $(TF_STATE_ACCESS_KEY)
        TF_STATE_SECRET_KEY:  $(TF_STATE_SECRET_KEY)
