trigger:
  branches:
    include:
      - main
  paths:
    include:
      - iac/oci/**

variables:
- group: terraform

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: AzureCLI@2
  displayName: 'Terraform Init & Apply'
  inputs:
    azureSubscription: 'keyvalute-codex' # Your existing Azure Resource Manager connection
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    addSpnToEnvironment: true
    inlineScript: |
      # Install Terraform
      wget -O terraform.zip https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
      unzip terraform.zip
      sudo mv terraform /usr/local/bin/

      # Navigate to Terraform code
      cd iac/oci
      
      # The AzureCLI@2 task injects Azure SP credentials into the environment variables
      # ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID 
      # when addSpnToEnvironment is set to true. This allows the azurerm backend to authenticate automatically.
      export ARM_CLIENT_ID=$servicePrincipalId
      export ARM_CLIENT_SECRET=$servicePrincipalKey
      export ARM_TENANT_ID=$tenantId
      
      # We need to look up the subscription ID
      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
      
      # Explicitly tell Terraform NOT to use the Azure CLI session (which is restricted for Service Principals)
      export ARM_USE_AZURECLI=false

      echo "Initializing Terraform..."
      terraform init \
        -backend-config="resource_group_name=${TF_STATE_RG}" \
        -backend-config="storage_account_name=${TF_STATE_SA}" \
        -backend-config="container_name=${TF_STATE_CONTAINER}" \
        -backend-config="key=prod.terraform.tfstate"
      
      echo "Applying Terraform..."
      # TF_VAR_ variables injected from the 'terraform' variable group will automatically be picked up here
      terraform apply -auto-approve
