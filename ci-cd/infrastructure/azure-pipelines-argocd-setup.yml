trigger:
  branches:
    include:
      - main
  paths:
    include:
      - ci-cd/argo/**

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: AzureKeyVault@2
  inputs:
    azureSubscription: 'keyvalute-codex'
    KeyVaultName: 'kv-prod-codexrelic' # Or the vault where your root password is saved
    SecretsFilter: 'O2-ROOT-PASSWORD'
    RunAsPreJob: false
  displayName: 'Get Admin Password from Prod Key Vault'

- task: AzureKeyVault@2
  inputs:
    azureSubscription: 'keyvalute-codex'
    KeyVaultName: 'kv-github-codexrelic'
    SecretsFilter: 'GITHUB-PAT,GITHUB-USERNAME'
    RunAsPreJob: false
  displayName: 'Get GitHub Credentials from Key Vault'

- task: CopyFilesOverSSH@0
  displayName: 'Copy Argo configurations to the VM'
  inputs:
    sshEndpoint: 'oci-vm-ssh'
    sourceFolder: '$(System.DefaultWorkingDirectory)/ci-cd/argo'
    contents: '**'
    targetFolder: '~/argo_setup'
    readyTimeout: '20000'

- task: SSH@0
  displayName: 'Deploy and Configure ArgoCD on OCI VM'
  inputs:
    sshEndpoint: 'oci-vm-ssh'
    runOptions: 'inline'
    inline: |
      set -e
      
      # Hash the password on the remote VM
      sudo apt-get update && sudo apt-get install -y apache2-utils
      # We use Azure DevOps macro substitution to safely inject the secret here
      HASHED_PASSWORD=$(htpasswd -bnBC 10 "" '$(O2-ROOT-PASSWORD)' | tr -d ':\n')
      
      echo "1. Creating Namespace..."
      sudo kubectl create namespace argocd --dry-run=client -o yaml | sudo kubectl apply -f -
      
      echo "2. Applying Argo CD Core..."
      sudo kubectl apply --server-side -k ~/argo_setup/
      
      echo "3. Patching Admin Password..."
      sudo kubectl -n argocd patch secret argocd-secret \
        -p '{"stringData": {
          "admin.password": "'$HASHED_PASSWORD'",
          "admin.passwordMtime": "'$(date +%FT%T%Z)'"
        }}'
        
      echo "4. Injecting GitHub Repo Secret..."
      cat <<INNER_EOF | sudo kubectl apply -f -
      apiVersion: v1
      kind: Secret
      metadata:
        name: github-repo-secret
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repository
      type: Opaque
      stringData:
        url: https://github.com/mohdazam193/codexrelic.com.git
        password: $(GITHUB-PAT)
        username: $(GITHUB-USERNAME)
      INNER_EOF
      
      echo "5. Deploying Multi-Environment Apps..."
      sudo kubectl apply -f ~/argo_setup/apps/
      
      echo "[OK] ArgoCD fully deployed and configured!"
