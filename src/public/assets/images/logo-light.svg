<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64">
  <defs>
    <linearGradient id="appleLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#409CFF"/>
    </linearGradient>
    <linearGradient id="specularGlowLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0071E3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Icon Mark -->
  <g filter="url(#subtleShadowLight)">
    <rect x="4" y="8" width="48" height="48" rx="14" fill="url(#appleLightGrad)"/>
    <rect x="4" y="8" width="48" height="48" rx="14" fill="url(#specularGlowLight)"/>
    <rect x="4.5" y="8.5" width="47" height="47" rx="13.5" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>

  <!-- Modern Precision SRE Glyph: Command Prompt & Node -->
  <path d="M21 24L30 32L21 40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="33" y1="40" x2="41" y2="40" stroke="#E1F0FF" stroke-width="3" stroke-linecap="round"/>

  <!-- Apple SF Pro Wordmark -->
  <text x="64" y="33" fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="19" font-weight="700" letter-spacing="-0.025em">CODEX<tspan fill="#0071E3">RELIC</tspan></text>
  <text x="64.5" y="47" fill="rgba(60, 60, 67, 0.65)" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="0.16em">SRE • PLATFORM ENGINE</text>
</svg>
