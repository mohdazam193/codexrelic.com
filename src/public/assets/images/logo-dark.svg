<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64">
  <defs>
    <linearGradient id="appleDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="specularGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A84FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Icon Mark -->
  <g filter="url(#subtleShadow)">
    <rect x="4" y="8" width="48" height="48" rx="14" fill="url(#appleDarkGrad)"/>
    <rect x="4" y="8" width="48" height="48" rx="14" fill="url(#specularGlow)"/>
    <rect x="4.5" y="8.5" width="47" height="47" rx="13.5" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>

  <!-- Modern Precision SRE Glyph: Command Prompt & Node -->
  <path d="M21 24L30 32L21 40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="33" y1="40" x2="41" y2="40" stroke="#64D2FF" stroke-width="3" stroke-linecap="round"/>

  <!-- Apple SF Pro Wordmark -->
  <text x="64" y="33" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="19" font-weight="700" letter-spacing="-0.025em">CODEX<tspan fill="#0A84FF">RELIC</tspan></text>
  <text x="64.5" y="47" fill="rgba(235, 235, 245, 0.55)" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="0.16em">SRE • PLATFORM ENGINE</text>
</svg>
